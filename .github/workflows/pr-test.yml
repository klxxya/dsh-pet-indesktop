name: PR Test Gate

# PR/push 门禁：测试 + ruff。与三条 build-*.yml（tag/手动触发的打包发布）
# 职责不同——本工作流给每个 PR 提供红绿判定，防止「测试只在本机是财富」。

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    # 编码隔离（issue #26）：强制 UTF-8，避免中文源码/资源被 legacy 编码二次解码
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
      # keyring 在无桌面环境的 runner 上可能弹后端探测；测试不需要真实钥匙串
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # PySide6 在 Linux 上 import 需要系统 EGL/GL 等库（与 build-linux.yml 一致）
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1 libdbus-1-3 fonts-noto-cjk

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff
        run: ruff check pet/ tests/

      # 桥接插件零依赖门禁（2026-09 事故回归防线）：bridge 经 pnpm link: 链进
      # 用户 profile，link 不装依赖、链接目标常是打包版 _internal 副本（无
      # node_modules）——任何外部 bare import 都会让用户开联动后整个 dsh
      # 插件树加载失败。此前这类回归无任何 CI 覆盖。
      # 两层校验：node --test 跑全部 7 个 bridge 契约测试（原地 import 捕获
      # 静态外部依赖回归）；verify_import.mjs 做 hermetic 校验（拷进无
      # node_modules 的临时目录 import + 清单零依赖 + envelope 形状 + 动态
      # import/require 静态禁令 + 临时目录祖先链污染探测）。
      # 注意：新增 bridge 测试文件时必须同步下面的显式清单（Node 20 无 glob）。
      - name: Bridge plugin zero-dependency gate
        run: |
          node --test tests/test_bridge_hardfailure.js tests/test_bridge_interaction_dedup.js tests/test_bridge_manifest.js tests/test_bridge_question_callid.js tests/test_bridge_retry.js tests/test_bridge_root_control.js tests/test_bridge_user_action_guard.js
          node integrations/dsh-pet-bridge/verify_import.mjs

      - name: Pytest (main suite)
        run: python -m pytest -v --ignore=tests/test_webm_reader_lifecycle.py --ignore=tests/test_webm_clip_lifecycle.py --ignore=tests/test_webm_first_frame_lock.py --ignore=tests/test_low_priority_warm_interaction_yield.py

      # DIAG v2：mac 只跑 trio（崩点组合）——快迭代钉崩点
      - name: Pytest (mac trio only, verbose)
        if: always() && matrix.os == 'macos-latest'
        run: python -m pytest -v tests/test_overlay_spawn.py tests/test_overlay_lifecycle_gaps.py tests/test_sprite_visibility.py

      # DIAG v8：visibility 之后是 stream_capture（legacy PetWindow 真控件）——验引爆者
      - name: Pytest (mac stream duo alone)
        if: always() && matrix.os == 'macos-latest'
        run: python -m pytest -q tests/test_stream_capture_compat.py tests/test_stream_capture_copy.py; echo "DIAG-STREAM-EXIT=$?"
      - name: Pytest (mac vis+stream)
        if: always() && matrix.os == 'macos-latest'
        run: python -m pytest -q $(cat diag-quarters/vis_stream.txt); echo "DIAG-VISSTREAM-EXIT=$?"
      - name: Pytest (mac trio+stream)
        if: always() && matrix.os == 'macos-latest'
        run: python -m pytest -q $(cat diag-quarters/trio_stream.txt); echo "DIAG-TRIOSTREAM-EXIT=$?"
      - name: Pytest (mac Q4+stream)
        if: always() && matrix.os == 'macos-latest'
        run: python -m pytest -q $(cat diag-quarters/q4s.txt); echo "DIAG-Q4S-EXIT=$?"
      - name: Pytest (webm lifecycle family, isolated)
        run: python -m pytest -q tests/test_webm_reader_lifecycle.py tests/test_webm_clip_lifecycle.py tests/test_webm_first_frame_lock.py

      # 低优预热让路族（test_low_priority_warm_interaction_yield.py）依赖真实
      # 线程编舞（worker 阻塞/放行），断言本身正确但时序窗口在 CI 满载 runner
      # 上会被极度拉长（本地与 ubuntu 稳过、windows CI 偶发批次起步超时）。
      # 隔离 + 允许一次重跑：重跑仍红才算真失败，避免时序抖动拖垮 PR 门禁。
      - name: Pytest (low-priority warm family, isolated + one retry)
        run: python -m pytest -q tests/test_low_priority_warm_interaction_yield.py || python -m pytest -q tests/test_low_priority_warm_interaction_yield.py

      # frameseq 原生崩溃隔离位：全套件上下文 ~28% 处偶发 Windows access violation，
      # verbose 复现钉死肇事者为
      # tests/test_frameseq_clip.py::test_retained_frame_is_not_reused_as_frame_zero
      # （主线程执行该用例时崩溃、Python 帧链被原生栈破坏；单测 deselect 后全量
      # 4129 绿 exit=0）。此前归因 watchdog 族系按位置的误判——该族独立/全族均
      # 全绿，已排除嫌疑，回归主套件。崩溃会杀掉整个 pytest 进程、拖垮主套件
      # 结果报告，按 webm 族先例隔离；根因排查归 frameseq 批属主。
      # 隔离不掩盖失败：照跑照判红，只额外给一次重跑机会。
      # DIAG：mac 段错误后抓系统崩溃报告（.ips 含原生回溯，钉无 Python 帧的崩线程）
      - name: Dump macOS crash report
        if: always() && matrix.os == 'macos-latest'
        run: |
          sleep 2
          ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -3
          LATEST=$(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -1)
          if [ -n "$LATEST" ]; then
            echo "=== $LATEST ==="
            python3 -c "
import json,sys
lines=open('$LATEST',encoding='utf-8',errors='replace').read().splitlines()
meta=json.loads(lines[0]) if lines else {}
body=json.loads('
'.join(lines[1:])) if len(lines)>1 else {}
print('crashed thread:', body.get('faultingThread'))
threads=body.get('threads',[])
ft=body.get('faultingThread',0)
imgs=body.get('usedImages',[])
for f in threads[ft].get('frames',[])[:25]:
    img=imgs[f.get('imageIndex',0)] if f.get('imageIndex') is not None else {}
    print(f\"  {img.get('name','?')}::{f.get('symbol','?')}\")
"
          fi
      - name: Pytest (frameseq native-crash isolates, isolated + one retry)
        run: python -m pytest -q tests/test_frameseq_prefetch_watchdog.py tests/test_frameseq_clip.py || python -m pytest -q tests/test_frameseq_prefetch_watchdog.py tests/test_frameseq_clip.py

